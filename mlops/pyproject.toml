[build-system]
requires = ["setuptools==82.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "full-manager-mvp-llmops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mlflow==3.14.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
