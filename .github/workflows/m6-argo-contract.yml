name: M6 Argo control-plane runner contract

on:
  pull_request:
    paths:
      - 'scripts/handoff/run_argo_control_plane.py'
      - 'scripts/handoff/run_argo_control_plane_from_env.sh'
      - 'scripts/handoff/run_argo_ephemeral_kind.py'
      - 'scripts/handoff/run_argo_ephemeral_kind_from_env.sh'
      - 'tests/handoff/test_argo_control_plane_contract.py'
      - 'tests/handoff/test_argo_ephemeral_kind_contract.py'
      - '.github/workflows/m6-argo-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m6-argo-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile Python and shell wrappers
        run: |
          python3 -m py_compile scripts/handoff/run_argo_control_plane.py scripts/handoff/run_argo_ephemeral_kind.py
          bash -n scripts/handoff/run_argo_control_plane_from_env.sh
          bash -n scripts/handoff/run_argo_ephemeral_kind_from_env.sh
      - name: Run no-side-effect contract tests
        run: |
          python3 tests/handoff/test_argo_control_plane_contract.py -v
          python3 tests/handoff/test_argo_ephemeral_kind_contract.py -v
      - name: Assert old wrapper still rejects missing identities
        run: |
          if env -u M6_ARGO_CLUSTER_CONTEXT -u M6_ARGO_TARGET_REVISION -u M6_ARGO_CD_MANIFEST_URL -u M6_ARGO_CD_MANIFEST_SHA256 -u M6_ARGO_ROLLOUTS_MANIFEST_URL -u M6_ARGO_ROLLOUTS_MANIFEST_SHA256 \
            bash scripts/handoff/run_argo_control_plane_from_env.sh --plan-only >/tmp/m6-argo-missing.out 2>&1; then
            echo 'old wrapper unexpectedly accepted missing identities'
            exit 1
          fi
          grep -q 'M6_ARGO_CLUSTER_CONTEXT' /tmp/m6-argo-missing.out
      - name: Assert self-contained wrapper rejects missing identities
        run: |
          if env -u M7_ARGO_KIND_NODE_IMAGE -u M7_ARGO_TARGET_REVISION -u M7_ARGO_CD_MANIFEST_URL -u M7_ARGO_CD_MANIFEST_SHA256 -u M7_ARGO_ROLLOUTS_MANIFEST_URL -u M7_ARGO_ROLLOUTS_MANIFEST_SHA256 \
            bash scripts/handoff/run_argo_ephemeral_kind_from_env.sh --plan-only >/tmp/m7-argo-missing.out 2>&1; then
            echo 'ephemeral wrapper unexpectedly accepted missing identities'
            exit 1
          fi
          grep -q 'M7_ARGO_KIND_NODE_IMAGE' /tmp/m7-argo-missing.out
      - name: Assert hardened self-contained plan-only boundary
        run: |
          M7_ARGO_KIND_NODE_IMAGE='kindest/node@sha256:1111111111111111111111111111111111111111111111111111111111111111' \
          M7_ARGO_TARGET_REVISION='2222222222222222222222222222222222222222' \
          M7_ARGO_CD_MANIFEST_URL='https://example.invalid/argocd.yaml' \
          M7_ARGO_CD_MANIFEST_SHA256='3333333333333333333333333333333333333333333333333333333333333333' \
          M7_ARGO_ROLLOUTS_MANIFEST_URL='https://example.invalid/rollouts.yaml' \
          M7_ARGO_ROLLOUTS_MANIFEST_SHA256='4444444444444444444444444444444444444444444444444444444444444444' \
            bash scripts/handoff/run_argo_ephemeral_kind_from_env.sh --plan-only > /tmp/m7-argo-plan.json
          jq -e '.cluster_name == "manager-demo-m7-argo" and .cluster_context == "kind-manager-demo-m7-argo"' /tmp/m7-argo-plan.json >/dev/null
          jq -e '.resource_budget.max_clusters_created == 1 and .resource_budget.cluster_cleanup_required == true and .resource_budget.kubectl_context_restore_required == true' /tmp/m7-argo-plan.json >/dev/null
          jq -e '.resource_budget.max_manifest_downloads == 2 and .resource_budget.max_manifest_bytes_each <= 20000000' /tmp/m7-argo-plan.json >/dev/null
          jq -e '.evidence_ceiling_after_real_execution == "LOCAL_ARGO_CONTROLLERS_READY_ONLY"' /tmp/m7-argo-plan.json >/dev/null
          jq -e '.operations | any(contains("delete the attempted cluster"))' /tmp/m7-argo-plan.json >/dev/null
      - name: Evidence boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## M6/M7 Argo runner boundary
          - original controller runner contract: exercised
          - self-contained ephemeral-kind orchestration contract: exercised
          - exact kind-node digest gate: exercised
          - cluster takeover refusal/cleanup/context-restore contract: exercised
          - exact manifest URL/SHA + 20 MB bounds: exercised
          - real kind creation / Argo install: **NOT_EXERCISED**
          - Argo CD Application reconciliation: **NOT_EXERCISED**
          - live Rollouts canary analysis: **NOT_EXERCISED**
          - contract evidence ceiling: `GITHUB_HOSTED_ARGO_RUNNER_CONTRACT_ONLY`
          EOF
