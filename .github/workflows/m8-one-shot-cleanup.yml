name: M8 one-shot workflow cleanup

on:
  push:
    branches:
      - chore/m8-remove-one-shot-workflows
    paths:
      - '.github/workflows/m8-one-shot-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact cleanup subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Remove one-shot compiler workflows and self
        run: |
          rm -f \
            .github/workflows/m8-main-integration-sync.yml \
            .github/workflows/m8-closure-matrix-finalize.yml \
            .github/workflows/m8-one-shot-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'chore: remove M8 one-shot compiler workflows'
          git push origin HEAD:${{ github.ref_name }}
