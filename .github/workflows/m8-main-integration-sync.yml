'''
          Path('registry/closure-matrix.yaml').write_text(closure, encoding='utf-8')

          stack = Path('registry/stack-plan.yaml')
          stack_text = stack.read_text(encoding='utf-8')
          stack_text = re.sub(r'^version:\s*\d+', 'version: 10', stack_text, count=1, flags=re.M)
          stack.write_text(stack_text, encoding='utf-8')
          stack_append = r'''## M8 merged-main atom

```text
