                  'physical_receipts_admitted': 0,
                  'advanced_compiler': 'scripts/handoff/compile_m7_advanced_queue.py',
                  'advanced_live_queue_state': 'NOT_COMPILED',
              },
              'residuals': {
                  'local_reviewer': 'NOT_EXERCISED',
                  'live_kind_kubernetes': 'NOT_EXERCISED',
                  'argo_controllers': 'NOT_EXERCISED',
                  'argo_application_reconcile': 'NOT_EXERCISED',
                  'live_rollouts_canary': 'NOT_EXERCISED',
