                  'synthetic_1000_vu': 'NOT_EXERCISED',
                  'registry_signing': 'NOT_EXERCISED',
                  'production_users_incidents_tenure': 'OUTSIDE_CURRENT_PROOF',
                  'people_management_tenure': 'OUTSIDE_REPOSITORY_PROOF',
              },
              'evidence_ceiling': 'GITHUB_HOSTED_MERGED_MAIN_INTEGRATION_AND_HANDOFF_ROUTING_ONLY',
          }
          Path('registry/public-m8-main-integration.json').write_text(json.dumps(registry, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          closure = '''schema_version: full-manager-mvp/closure-matrix/v1
milestone: M8
policy:
  issue_state_is_not_capability_evidence: true
  merged_pr_is_not_physical_runtime_evidence: true
  close_contract_only_when_own_acceptance_complete: true
  keep_physical_lanes_open_until_receipt: true
close_candidates:
  - {issue: 1, reason: evidence_audit_and_invariant_freeze_merged}
