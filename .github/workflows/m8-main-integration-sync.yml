name: M8 main integration sync

on:
  push:
    branches:
      - audit/m8-main-integration-closure
    paths:
      - '.github/workflows/m8-main-integration-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m8-main-integration-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Compile M8 public-safe routing surfaces
        env:
          SYNC_SOURCE_COMMIT: ${{ github.sha }}
          SYNC_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import re
          from pathlib import Path

          START = '<!-- M8_MAIN_INTEGRATION_START -->'
          END = '<!-- M8_MAIN_INTEGRATION_END -->'

          def upsert(path: str, body: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8') if p.exists() else ''
              block = f"{START}\n{body.rstrip()}\n{END}\n"
              pattern = re.compile(re.escape(START) + r'.*?' + re.escape(END) + r'\n?', re.S)
              if pattern.search(text):
                  text = pattern.sub(block, text)
              else:
                  text = text.rstrip() + '\n\n' + block
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          readme = r'''## M8 — merged-main integration and Local Handoff readiness

```text
M8 PUBLIC_MAIN_INTEGRATION_AND_LOCAL_HANDOFF_READY = PASS_BOUNDED
```

M8 means the reviewed implementation and M2–M7 traceability stacks are reachable from `main`, completed contract-only work has a closure route, and the remaining physical work is encoded as a receipt-gated Local Handoff. It does **not** mean local or production runtime execution has occurred.

### Merged implementation topology

```text
main
└─ PR #6 bootstrap/program root
   └─ PR #12 architecture and technology contract
      └─ PR #13 evidence audit / invariant freeze
         └─ PR #14 typed Core platform
            ├─ PR #38 policy/security/license
            ├─ PR #39 ML/LLMOps
            │  ├─ PR #55 self-contained Argo runner contract
            │  └─ PR #56 local model runner contract
            ├─ PR #37 Manager Demo Console
            ├─ PR #40 supply-chain/fault
            │  └─ PR #58 registry-signing runner contract
            └─ PR #36 observability/load
               ├─ PR #57 1,000-VU runner contract
               └─ PR #42 failure/recovery
                  └─ PR #44 reviewer convergence
                     └─ PR #45 Local Handoff bootstrap
                        └─ PR #51 live-kind runner
                           └─ PR #52 canonical queue
                              └─ PR #65 M7 advanced execution bundle

M2→M7 documentation/index stack
└─ PR #68 merged to main after the executable stack
```

Git ancestry and task-DAG dependencies remain separate. Side-input receipt or byte-parity edges are not represented as fake Git parents.

### Directory → State Machine → DAG ownership

| Directory | State-machine responsibility | Primary merged atoms | Current ceiling |
|---|---|---|---|
| `platform/app/`, `platform/docker/`, `platform/kubernetes/` | `BUILD_TESTED → ARTIFACT_BOUND → APPLICATION_READY` | #14 | remote CI plus runner contracts; live kind receipt absent |
| `observability/`, `sre/`, `tests/load/` | `OBSERVED → LOAD_PROBED → HEALTHY/DEGRADED` | #36, #57 | remote 20-VU proof plus 1,000-VU runner contract |
| `platform/policies/` | `POLICY_EVALUATED → ADMITTED/REJECTED` | #38 | bounded OPA/Trivy/license evidence |
| `mlops/`, `platform/rollouts/` | `EVAL_RUNNING → PROMOTION_ELIGIBLE/CANARY_REJECTED` | #39, #55, #56 | deterministic lifecycle plus physical runners not exercised |
| `demo-console/` | `REVIEWER_PACKET_ASSEMBLED → DEMO_VISIBLE` | #37, #44 | reviewer UI; no evidence promotion authority |
| `supply-chain/` | `SBOM_CREATED → SIGNED/REJECTED` | #40, #58 | remote artifact proof plus local registry runner contract |
| `tests/failure/scenarios/`, `incidents/`, `runbooks/`, `management/` | `INCIDENT_ACTIVE → RECOVERED → SAME_FAILURE_RETEST` | #42 | deterministic DRILL/SIMULATION only |
| `handoff/`, `scripts/handoff/` | `LOCAL_REVIEWER_ACTIVE → LIVE_KIND → ADVANCED_QUEUE` | #45, #51, #52, #65 | queue/runner/compiler readiness only |
| `docs/`, `registry/` | `EVIDENCE_BOUND → INDEXED → ROUTED` | #41/#43/#46/#53/#59/#66/#68 | public traceability, not runtime proof |

### Runtime data flow

```text
source / requirement
→ invariant and evidence contract
→ Core implementation
→ CI / SBOM / policy / eval / telemetry
→ deterministic failure and same-failure re-test
→ reviewer packet and Demo Console
→ canonical Local Handoff queue
→ local reviewer receipt
→ live-kind receipt
→ M7 live advanced queue compilation
→ Argo controllers
→ local model
→ synthetic 1,000 VU
→ registry-stored signing
→ bounded local evidence packet
```

### Current Local Handoff frontier

```text
M5-LOCAL-REVIEWER-001       ACTIVE
M5-LIVE-KIND-002            BLOCKED_BY_PREDECESSOR
M6-ADVANCED-SUBSTRATE-003   BLOCKED_BY_PREDECESSOR
```

After both real predecessor receipts are admitted, `scripts/handoff/compile_m7_advanced_queue.py` may emit the next canonical queue with exactly one ACTIVE item. Fixture receipts never satisfy live completion edges.

### Residuals

```text
local deterministic reviewer             NOT_EXERCISED
live kind/Kubernetes application smoke   NOT_EXERCISED
live advanced queue compilation          NOT_EXERCISED
Argo controllers                         NOT_EXERCISED
Argo CD Application reconcile            NOT_EXERCISED
live Rollouts canary                     NOT_EXERCISED
llama.cpp/model inference                NOT_EXERCISED
synthetic 1,000 VU                       NOT_EXERCISED
registry-stored signing                  NOT_EXERCISED
production users/incidents/tenure        OUTSIDE_CURRENT_PROOF
people-management tenure                 OUTSIDE_REPOSITORY_PROOF
```
'''
          upsert('README.md', readme)

          agents = r'''## M8 merged-main operating contract

The merged implementation and M2–M7 traceability are now reviewed as one `main` integration surface. Agents must still separate four identities:

```text
current main/routing head
historical evidence head
canonical predecessor execution epoch
physical runtime receipt subject
```

Mandatory M8 read order:

```text
README.md
→ docs/INDEX.md
→ docs/milestones/PUBLIC_M8_MAIN_INTEGRATION_AND_HANDOFF_READY.md
→ registry/public-m8-main-integration.json
→ registry/closure-matrix.yaml
→ registry/stack-plan.yaml
→ handoff/local-handoff-queue.json
→ handoff/LOCAL_HANDOFF_EXECUTION_QUEUE.md
→ exact issue / merged PR / Actions run / receipt
```

Closure laws:

- Close a contract-only issue only when its implementation, negative controls, traceability and merge edge are complete.
- Keep a capability issue open when its own acceptance requires a physical receipt that is absent.
- A merged PR is integration evidence, not runtime evidence.
- Issue state, README text, UI state and fixture receipts cannot close a physical edge.
- Do not reopen a completed molecular leaf merely because a higher-level convergence issue remains open.
- Do not close #9 or advanced physical lanes until the Local Handoff receipts exist.
- Do not advance the queue unattended; `queue_advance` remains automation-forbidden.
- Branch cleanup is exact-ref owner/admin work and cannot alter evidence claims.

Shadow Architect remains `MODE=MONITOR` and blocks stale subjects, fixture/live laundering, authority widening, unbounded resources, cleanup failure, secret disclosure, semantic conflict, or production/experience claim inflation.
'''
          upsert('AGENTS.md', agents)

          index = r'''## M8 merged-main integration route

```text
README.md
→ AGENTS.md
→ docs/milestones/PUBLIC_M8_MAIN_INTEGRATION_AND_HANDOFF_READY.md
→ registry/public-m8-main-integration.json
→ registry/closure-matrix.yaml
→ registry/stack-plan.yaml
→ handoff/local-handoff-queue.json
→ handoff/LOCAL_HANDOFF_EXECUTION_QUEUE.md
```

M8 is a merged-main and handoff-readiness checkpoint only. Physical and production residuals remain explicit.
'''
          upsert('docs/INDEX.md', index)

          milestone = '''# M8 — PUBLIC_MAIN_INTEGRATION_AND_LOCAL_HANDOFF_READY

Status: `PASS_BOUNDED`

This milestone records merged-main integration, issue/PR closure classification, M1→M7 traceability continuity, and a concrete Local Handoff route. It does not record physical local or production execution.

## Integrated planes

- executable platform, observability, policy/security, ML/LLMOps, Demo Console and supply chain;
- deterministic failure/recovery and reviewer convergence;
- canonical Local Handoff, live-kind runner, advanced runner contracts and M7 queue compiler;
- README/AGENTS/milestone/registry traceability through M7.

## Closure decision classes

```text
CLOSE              own acceptance and merge edge complete
KEEP_OPEN          own physical/capability receipt absent
SUPERSEDE          replaced by a canonical later contract
LOCAL_HANDOFF      implementation ready; physical execution required
HUMAN_ONLY         production, visibility, permission, credential or experience admission
```

## Evidence boundary

`PASS_BOUNDED` here proves merged-main integration and machine-checkable routing. It cannot prove local Kubernetes, Argo, local model, 1,000-VU execution, registry signing, real users, production incidents, production tenure or people-management tenure.
'''
          Path('docs/milestones/PUBLIC_M8_MAIN_INTEGRATION_AND_HANDOFF_READY.md').write_text(milestone, encoding='utf-8')

          merged_prs = [6, 12, 13, 14, 36, 37, 38, 39, 40, 42, 44, 45, 51, 52, 55, 56, 57, 58, 65, 68]
          registry = {
              'schema_version': 'full-manager-mvp/public-m8-main-integration/v1',
              'milestone': 'PUBLIC_MAIN_INTEGRATION_AND_LOCAL_HANDOFF_READY',
              'verdict': 'PASS_BOUNDED',
              'sync_source': {
                  'repository': 'ed3c/DevOps-Manager-Notes',
                  'branch': os.environ['SYNC_BRANCH'],
                  'commit': os.environ['SYNC_SOURCE_COMMIT'],
              },
              'canonical_method': {
                  'repository': 'ed3c/skills-shared',
                  'commit': '4ca9417b1da5ff32f1d4d3e7af64a15908749024',
                  'queue_schema': 'agentic-tech-lead/local-handoff-queue/v1',
              },
              'expected_merged_pull_requests': merged_prs,
              'main_integration_state': 'VALIDATION_PENDING',
              'local_handoff': {
                  'queue': 'handoff/local-handoff-queue.json',
