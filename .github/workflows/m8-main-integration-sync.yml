          Path('handoff/LOCAL_HANDOFF_EXECUTION_QUEUE.md').write_text(handoff, encoding='utf-8')

          validation = r'''name: M8 merged-main integration audit

on:
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/INDEX.md'
      - 'docs/milestones/PUBLIC_M8_MAIN_INTEGRATION_AND_HANDOFF_READY.md'
      - 'registry/public-m8-main-integration.json'
      - 'registry/closure-matrix.yaml'
      - 'registry/stack-plan.yaml'
      - 'registry/STACK-M8.md'
      - 'handoff/local-handoff-queue.json'
      - 'handoff/LOCAL_HANDOFF_EXECUTION_QUEUE.md'
      - '.github/workflows/m8-main-integration-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: m8-main-integration-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      SKILLS_SHARED_COMMIT: 4ca9417b1da5ff32f1d4d3e7af64a15908749024
    steps:
      - name: Checkout exact audit subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout canonical Tech Lead method
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ed3c/skills-shared
          ref: ${{ env.SKILLS_SHARED_COMMIT }}
          path: _skills-shared
          persist-credentials: false

      - name: Verify merged implementation surface
        run: |
          required=(
            platform/app/pyproject.toml
            platform/docker/Dockerfile
            platform/kubernetes/render_deployment.py
            observability
            platform/policies
            mlops
            demo-console/package.json
            supply-chain
            tests/failure/scenarios/run_failure_drills.py
            scripts/demo/run_reviewer_demo.sh
            scripts/handoff/run_local_reviewer_handoff.py
            scripts/handoff/run_live_kind_smoke.py
            scripts/handoff/compile_m7_advanced_queue.py
            scripts/handoff/run_argo_ephemeral_kind.py
            scripts/handoff/run_local_model.py
            scripts/handoff/run_local_capacity.py
            scripts/handoff/run_local_registry_signing.py
          )
          for path in "${required[@]}"; do test -e "$path" || { echo "missing merged path: $path"; exit 1; }; done

      - name: Verify expected PRs are merged
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib import request

          x = json.loads(Path('registry/public-m8-main-integration.json').read_text())
          observed = {}
          for number in x['expected_merged_pull_requests']:
              req = request.Request(
                  f'https://api.github.com/repos/ed3c/DevOps-Manager-Notes/pulls/{number}',
                  headers={
                      'Authorization': f'Bearer {os.environ["GITHUB_TOKEN"]}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with request.urlopen(req, timeout=15) as response:
                  p = json.load(response)
              observed[str(number)] = {'state': p['state'], 'merged': p['merged'], 'merge_commit_sha': p['merge_commit_sha']}
              if not p['merged'] or p['state'] != 'closed' or not p['merge_commit_sha']:
                  raise SystemExit(f'PR #{number} is not merged')
          Path('/tmp/m8-merged-prs.json').write_text(json.dumps(observed, indent=2, sort_keys=True) + '\n')
          print('merged-pr-readback=PASS')
          PY

      - name: Validate canonical Local Handoff queue
        run: |
          python3 _skills-shared/skills/agentic-tech-lead-orchestration/scripts/assert_local_handoff_queue.py \
            --queue handoff/local-handoff-queue.json
          python3 _skills-shared/skills/agentic-tech-lead-orchestration/scripts/assert_local_handoff_queue.py \
            --queue handoff/local-handoff-queue.json \
            --selftest

      - name: Verify closure matrix and evidence ceiling
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path('registry/public-m8-main-integration.json').read_text())
          assert x['verdict'] == 'PASS_BOUNDED'
          assert x['local_handoff']['active_item'] == 'M5-LOCAL-REVIEWER-001'
          assert x['local_handoff']['physical_receipts_admitted'] == 0
          assert x['local_handoff']['advanced_live_queue_state'] == 'NOT_COMPILED'
          assert all(v in {'NOT_EXERCISED','OUTSIDE_CURRENT_PROOF','OUTSIDE_REPOSITORY_PROOF'} for v in x['residuals'].values())
          text = Path('registry/closure-matrix.yaml').read_text()
          for token in ('close_candidates:', 'keep_open:', 'issue: 9', 'issue: 54', 'issue: 67'):
              assert token in text, token
          assert Path('registry/stack-plan.yaml').read_text().startswith('version: 10')
          PY

      - name: Public disclosure and no-runtime boundary
        run: |
          if grep -R -E '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_)' \
            README.md AGENTS.md docs/milestones/PUBLIC_M8_MAIN_INTEGRATION_AND_HANDOFF_READY.md \
            registry/public-m8-main-integration.json registry/closure-matrix.yaml handoff/LOCAL_HANDOFF_EXECUTION_QUEUE.md; then
            echo 'secret-like material found in M8 public surface'
            exit 1
          fi
          test ! -f evidence/local-reviewer/handoff-receipt.json
          test ! -f evidence/local-kind/local-kind-receipt.json
          test ! -f handoff/m7-advanced-local-handoff-queue.json

      - name: Evidence boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## M8 merged-main integration boundary
          - expected merged PR readback: exercised
          - merged implementation path readback: exercised
          - canonical Local Handoff assertion/selftest: exercised
          - closure matrix and M8 routing: exercised
          - local reviewer / kind / advanced runtime: **NOT_EXERCISED**
          - production users/incidents/tenure: **OUTSIDE_CURRENT_PROOF**
          - evidence ceiling: `GITHUB_HOSTED_MERGED_MAIN_INTEGRATION_AND_HANDOFF_ROUTING_ONLY`
          EOF
'''
          Path('.github/workflows/m8-main-integration-audit.yml').write_text(validation, encoding='utf-8')
          PY

      - name: Commit compiled surfaces
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md docs/INDEX.md docs/milestones/PUBLIC_M8_MAIN_INTEGRATION_AND_HANDOFF_READY.md \
            registry/public-m8-main-integration.json registry/closure-matrix.yaml registry/stack-plan.yaml registry/STACK-M8.md \
            handoff/LOCAL_HANDOFF_EXECUTION_QUEUE.md .github/workflows/m8-main-integration-audit.yml
          if git diff --cached --quiet; then
            echo 'M8 surfaces already compiled'
            exit 0
          fi
          git commit -m 'docs: compile M8 merged-main closure and Local Handoff [m8-sync]'
          git push origin HEAD:${{ github.ref_name }}
