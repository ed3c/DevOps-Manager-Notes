name: Full MVP core platform

on:
  pull_request:
    paths:
      - 'platform/app/**'
      - 'platform/docker/**'
      - 'platform/kubernetes/**'
      - 'platform/gitops/**'
      - 'tests/unit/**'
      - 'tests/integration/**'
      - 'evidence/receipts/base/**'
      - '.github/workflows/core-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: managerdemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d managerdemo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/managerdemo

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/app/pyproject.toml

      - name: Install app and test dependencies
        run: python -m pip install -e 'platform/app[dev]'

      - name: Static compile
        run: python -m compileall -q platform/app/src tests

      - name: Unit and integration tests
        run: pytest -q tests/unit tests/integration

      - name: PostgreSQL migration upgrade
        run: alembic -c platform/app/alembic.ini upgrade head

      - name: PostgreSQL migration downgrade and re-upgrade
        run: |
          alembic -c platform/app/alembic.ini downgrade base
          alembic -c platform/app/alembic.ini upgrade head

      - name: Validate immutable Kubernetes render guard
        run: |
          if python3 platform/kubernetes/render_deployment.py \
            --image-ref 'example.invalid/full-manager-mvp:mutable' \
            --output /tmp/should-not-exist.yaml; then
            echo 'mutable image reference was incorrectly admitted'
            exit 1
          fi
          python3 platform/kubernetes/render_deployment.py \
            --image-ref 'example.invalid/full-manager-mvp@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
            --output /tmp/deployment.yaml
          grep -q '@sha256:' /tmp/deployment.yaml

      - name: Build container
        run: docker build -f platform/docker/Dockerfile -t full-manager-mvp:${GITHUB_SHA} .

      - name: Run container against CI PostgreSQL
        run: |
          docker run -d --rm --network host \
            --name full-manager-mvp-core \
            -e DATABASE_URL="${DATABASE_URL}" \
            full-manager-mvp:${GITHUB_SHA}
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs full-manager-mvp-core
          exit 1

      - name: Prove health is not business correctness
        run: |
          python - <<'PY'
          import json
          import urllib.request

          sha = '${{ github.sha }}'
          request = urllib.request.Request(
              'http://127.0.0.1:8000/v1/oracle/evaluate',
              data=json.dumps({
                  'subject': {'git_commit': sha},
                  'expected_value': 'approved',
                  'observed_value': 'rejected',
              }).encode(),
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              payload = json.load(response)
          assert payload['infrastructure_http_ok'] is True
          assert payload['business_ok'] is False
          assert payload['evidence']['verdict'] == 'FAIL'
          with urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5) as response:
              assert json.load(response)['status'] == 'alive'
          PY

      - name: Emit bounded base receipt summary
        if: always()
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## Full MVP core-platform evidence boundary
          - subject: \`${GITHUB_SHA}\`
          - deterministic tests: attempted in this job
          - PostgreSQL migration: attempted in this job
          - container build/run: attempted in this job
          - Kubernetes immutable-render guard: attempted in this job
          - kind/Kubernetes live deployment: **NOT_EXERCISED**
          - evidence ceiling: GitHub-hosted deterministic/container integration only; not production infrastructure
          EOF

      - name: Cleanup container
        if: always()
        run: docker rm -f full-manager-mvp-core >/dev/null 2>&1 || true
