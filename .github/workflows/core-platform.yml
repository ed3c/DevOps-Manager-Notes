name: Full MVP core platform

on:
  pull_request:
    paths:
      - 'platform/app/**'
      - 'platform/docker/**'
      - 'platform/kubernetes/**'
      - 'platform/gitops/**'
      - 'tests/unit/**'
      - 'tests/integration/**'
      - 'evidence/receipts/base/**'
      - '.github/workflows/core-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: managerdemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d managerdemo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/managerdemo
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact PR merge/workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/app/pyproject.toml

      - name: Install app and test dependencies
        run: python -m pip install -e 'platform/app[dev]'

      - name: Static compile
        run: python -m compileall -q platform/app/src tests evidence/receipts/base/generate_ci_receipt.py

      - name: Unit and integration tests
        run: pytest -q tests/unit tests/integration

      - name: PostgreSQL migration upgrade
        run: alembic -c platform/app/alembic.ini upgrade head

      - name: PostgreSQL migration downgrade and re-upgrade
        run: |
          alembic -c platform/app/alembic.ini downgrade base
          alembic -c platform/app/alembic.ini upgrade head

      - name: Validate immutable Kubernetes render guard
        run: |
          if python3 platform/kubernetes/render_deployment.py \
            --image-ref 'example.invalid/full-manager-mvp:mutable' \
            --output /tmp/should-not-exist.yaml; then
            echo 'mutable image reference was incorrectly admitted'
            exit 1
          fi
          python3 platform/kubernetes/render_deployment.py \
            --image-ref 'example.invalid/full-manager-mvp@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
            --output /tmp/deployment.yaml
          grep -q '@sha256:' /tmp/deployment.yaml

      - name: Build container from narrow context
        run: docker build -f platform/docker/Dockerfile -t full-manager-mvp:${GITHUB_SHA} platform/app

      - name: Run container against CI PostgreSQL
        run: |
          docker run -d --rm --network host \
            --name full-manager-mvp-core \
            -e DATABASE_URL="${DATABASE_URL}" \
            full-manager-mvp:${GITHUB_SHA}
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs full-manager-mvp-core
          exit 1

      - name: Prove health is not business correctness
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              'http://127.0.0.1:8000/v1/oracle/evaluate',
              data=json.dumps({
                  'subject': {'git_commit': os.environ['SOURCE_COMMIT']},
                  'expected_value': 'approved',
                  'observed_value': 'rejected',
              }).encode(),
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              payload = json.load(response)
          assert payload['infrastructure_http_ok'] is True
          assert payload['business_ok'] is False
          assert payload['evidence']['verdict'] == 'FAIL'
          assert payload['evidence']['subject']['git_commit'] == os.environ['SOURCE_COMMIT']
          with urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5) as response:
              assert json.load(response)['status'] == 'alive'
          PY

      - name: Generate exact-subject base receipt
        id: receipt
        run: |
          set -euo pipefail
          : "${ImageOS:?GitHub-hosted runner must expose ImageOS}"
          : "${ImageVersion:?GitHub-hosted runner must expose ImageVersion}"
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' full-manager-mvp:${GITHUB_SHA})"
          OUT="live-evidence/base-receipt.json"
          python3 evidence/receipts/base/generate_ci_receipt.py \
            --source-commit "${SOURCE_COMMIT}" \
            --workflow-commit "${GITHUB_WORKFLOW_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --runner-os "${RUNNER_OS}" \
            --runner-arch "${RUNNER_ARCH}" \
            --runner-image-os "${ImageOS}" \
            --runner-image-version "${ImageVersion}" \
            --container-image-id "${IMAGE_ID}" \
            --output "${OUT}"
          python -m json.tool "${OUT}" >/dev/null
          echo "path=${OUT}" >> "${GITHUB_OUTPUT}"

      - name: Persist base receipt outside producer job
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-manager-mvp-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.receipt.outputs.path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Emit bounded base receipt summary
        if: always()
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## Full MVP core-platform evidence boundary
          - source subject: \`${SOURCE_COMMIT}\`
          - workflow subject: \`${GITHUB_WORKFLOW_SHA}\`
          - deterministic tests/PostgreSQL migration/container/business negative control: attempted in this job
          - Kubernetes immutable-render guard: attempted in this job
          - kind/Kubernetes live deployment: **NOT_EXERCISED**
          - persisted receipt artifact digest: \`${{ steps.upload.outputs.artifact-digest }}\`
          - evidence ceiling: GitHub-hosted deterministic/container integration only; not production infrastructure
          EOF

      - name: Cleanup container
        if: always()
        run: docker rm -f full-manager-mvp-core >/dev/null 2>&1 || true
