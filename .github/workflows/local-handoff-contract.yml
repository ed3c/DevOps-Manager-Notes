name: Canonical Local Handoff contract

on:
  pull_request:
    paths:
      - 'handoff/local-handoff-queue.json'
      - 'registry/public-m8-main-integration.json'
      - 'scripts/handoff/run_local_reviewer_handoff.py'
      - 'scripts/handoff/run_live_kind_from_env.sh'
      - 'scripts/handoff/run_live_kind_smoke.py'
      - 'scripts/handoff/compile_m8_advanced_queue.py'
      - 'tests/handoff/test_compile_m8_advanced_queue.py'
      - '.github/workflows/local-handoff-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-local-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SKILLS_SHARED_COMMIT: 4ca9417b1da5ff32f1d4d3e7af64a15908749024
    steps:
      - name: Checkout exact consumer workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact canonical Tech Lead method
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ed3c/skills-shared
          ref: ${{ env.SKILLS_SHARED_COMMIT }}
          path: _skills-shared
          persist-credentials: false

      - name: Compile current Local Handoff helpers
        run: |
          python3 -m py_compile \
            scripts/handoff/run_local_reviewer_handoff.py \
            scripts/handoff/run_live_kind_smoke.py \
            scripts/handoff/compile_m7_advanced_queue.py \
            scripts/handoff/compile_m8_advanced_queue.py
          bash -n scripts/handoff/run_live_kind_from_env.sh
          python3 tests/handoff/test_compile_m8_advanced_queue.py -v

      - name: Run portable Local Handoff assertion
        run: |
          python3 _skills-shared/skills/agentic-tech-lead-orchestration/scripts/assert_local_handoff_queue.py \
            --queue handoff/local-handoff-queue.json
          python3 _skills-shared/skills/agentic-tech-lead-orchestration/scripts/assert_local_handoff_queue.py \
            --queue handoff/local-handoff-queue.json \
            --selftest

      - name: Verify exact execution subject contains every concrete command
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          queue = json.loads(Path('handoff/local-handoff-queue.json').read_text())
          subject = queue['subject']['commit']
          expected_tree = queue['subject']['tree']
          rollback = queue['subject']['rollback_commit']
          for label, value in (
              ('subject', subject), ('tree', expected_tree), ('rollback', rollback)
          ):
              assert re.fullmatch(r'[0-9a-f]{40}', value), (label, value)

          actual_tree = subprocess.check_output(
              ['git', 'rev-parse', f'{subject}^{{tree}}'], text=True
          ).strip()
          assert actual_tree == expected_tree, (actual_tree, expected_tree)
          subprocess.run(['git', 'cat-file', '-e', f'{rollback}^{{commit}}'], check=True)

          command_paths = set()
          for item in queue['items']:
              assert item['entry']['required_subject_commit'] == subject
              for command in item['runtime_lane']['commands']:
                  for token in command['argv']:
                      if token.startswith('scripts/') and token.endswith(('.py', '.sh')):
                          command_paths.add(token)
          assert command_paths, 'queue exposes no repository command paths'
          for path in sorted(command_paths):
              subprocess.run(['git', 'cat-file', '-e', f'{subject}:{path}'], check=True)
          print('execution-subject-readback=PASS')
          print('command-paths=' + ','.join(sorted(command_paths)))
          PY

      - name: Assert canonical routing and M8 machine consistency
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          queue = json.loads(Path('handoff/local-handoff-queue.json').read_text())
          m8 = json.loads(Path('registry/public-m8-main-integration.json').read_text())

          assert queue['schema_version'] == 'agentic-tech-lead/local-handoff-queue/v1'
          expected_subject = m8['local_handoff']['execution_subject']
          assert queue['subject']['commit'] == expected_subject['commit']
          assert queue['subject']['tree'] == expected_subject['tree']
          assert queue['subject']['rollback_commit'] == expected_subject['rollback_commit']
          assert queue['current']['active_item'] == m8['local_handoff']['active_item']
          assert queue['current']['state'] == 'ACTIVE'

          items = queue['items']
          assert [item['id'] for item in items] == [
              'M8-LOCAL-REVIEWER-001',
              'M8-LIVE-KIND-002',
              'M8-COMPILE-ADVANCED-QUEUE-003',
          ]
          assert [item['state'] for item in items] == [
              'ACTIVE', 'BLOCKED_BY_PREDECESSOR', 'BLOCKED_BY_PREDECESSOR'
          ]
          assert sum(item['state'] == 'ACTIVE' for item in items) == 1
          assert items[0]['entry']['predecessor'] is None
          for previous, current in zip(items, items[1:]):
              assert current['entry']['predecessor'] == previous['id']
          for item in items:
              assert item['entry']['required_subject_commit'] == queue['subject']['commit']
              assert item['runtime_lane']['commands']
              assert item['runtime_lane']['live_evidence_required'] is True
              assert item['receipt']['required_states'] == ['PASS', 'FAIL']
              assert item['exit']['requires_receipt'] is True
              assert item['exit']['required_verdict'] == 'PASS'

          reviewer_argv = items[0]['runtime_lane']['commands'][0]['argv']
          assert reviewer_argv[:2] == [
              'python3', 'scripts/handoff/run_local_reviewer_handoff.py'
          ]
          kind_command = items[1]['runtime_lane']['commands'][0]
          assert kind_command['argv'][:2] == [
              'bash', 'scripts/handoff/run_live_kind_from_env.sh'
          ]
          assert kind_command['environment_names'] == ['M5_KIND_NODE_IMAGE']
          compiler = items[2]['runtime_lane']['commands'][0]['argv']
          assert compiler[:2] == [
              'python3', 'scripts/handoff/compile_m8_advanced_queue.py'
          ]
          assert '--expected-predecessor-commit' in compiler
          assert expected_subject['commit'] in compiler
          assert '--expected-predecessor-tree' in compiler
          assert expected_subject['tree'] in compiler

          required_forbidden = {
              'merge', 'force_push', 'issue_close', 'queue_advance',
              'provider_activation', 'semantic_conflict_resolution',
          }
          assert required_forbidden.issubset(
              set(queue['authority']['automation_forbidden'])
          )
          assert m8['local_handoff']['physical_receipts_admitted'] == 0
          assert m8['local_handoff']['advanced_queue_state'] == 'NOT_COMPILED'
          print('canonical-m8-routing=PASS')
          PY

      - name: Public disclosure guard
        run: |
          if grep -R -E '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_)' \
            handoff/local-handoff-queue.json \
            registry/public-m8-main-integration.json \
            scripts/handoff/compile_m8_advanced_queue.py \
            tests/handoff/test_compile_m8_advanced_queue.py; then
            echo 'secret-like material found in canonical Local Handoff surface'
            exit 1
          fi

      - name: Evidence boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Canonical M8 Local Handoff boundary
          - canonical method subject: `ed3c/skills-shared@4ca9417b1da5ff32f1d4d3e7af64a15908749024`
          - portable queue assertion: exercised
          - portable queue negative-control selftest: exercised
          - exact execution-subject tree/rollback/command-path readback: exercised
          - explicit-subject advanced compiler wrapper tests: exercised
          - exactly one ACTIVE item and linear predecessor chain: exercised
          - local reviewer execution: **NOT_EXERCISED**
          - live kind/Kubernetes execution: **NOT_EXERCISED**
          - advanced queue compilation: **NOT_EXERCISED**
          - Argo/model/1,000-VU/signing runtime: **NOT_EXERCISED**
          - evidence ceiling: `GITHUB_HOSTED_CANONICAL_LOCAL_HANDOFF_CONTRACT_ONLY`
          EOF
