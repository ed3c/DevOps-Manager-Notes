name: M5 Local Handoff contract

on:
  pull_request:
    paths:
      - 'handoff/local-handoff-queue.json'
      - '.github/workflows/local-handoff-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate queue shape and evidence ceilings
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          q = json.loads(Path('handoff/local-handoff-queue.json').read_text())
          assert q['schema_version'] == 'agentic-tech-lead/local-handoff-queue/v1'
          assert q['subject']['commit'] == '55d18cdc556ca5d66c67406318ae25196c077fd2'
          assert q['subject']['tree'] == 'a4ad37d9baf73a5239f79c516c67b0182420336a'
          assert q['current']['active_item'] == 'M4-LOCAL-REVIEWER-001'
          assert q['current']['state'] == 'ACTIVE'
          assert q['current']['next_concrete_item'] == 'M4-LIVE-SUBSTRATE-002'

          items = {item['id']: item for item in q['items']}
          local = items['M4-LOCAL-REVIEWER-001']
          assert local['state'] == 'ACTIVE'
          assert local['runtime_lane']['commands'][0]['argv'] == [
              'bash', 'scripts/demo/run_reviewer_demo.sh', 'evidence/local-reviewer'
          ]
          assert local['receipt']['evidence_ceiling'] == 'LOCAL_DETERMINISTIC_REVIEWER_RUN_ONLY'
          assert local['exit']['required_verdict'] == 'PASS_BOUNDED'

          substrate = items['M4-LIVE-SUBSTRATE-002']
          assert substrate['state'] == 'WAITING_PREDECESSOR'
          assert substrate['entry']['predecessor'] == 'M4-LOCAL-REVIEWER-001'
          assert substrate['entry']['required_subject_commit'] == '20d2ccb0ed8c877309452eece7c755bb3411c4c1'
          assert substrate['entry']['required_subject_tree'] == '7d4b5d5aaba2d023803b152ce5ac7f23f274eba0'
          assert substrate['entry']['required_subject_pr'] == 51
          command = substrate['runtime_lane']['commands'][0]
          assert command['argv'] == [
              'bash', 'scripts/handoff/run_live_kind_from_env.sh',
              '--output', 'evidence/local-kind/local-kind-receipt.json',
              '--cluster-name', 'manager-demo-m5',
              '--local-port', '18030'
          ]
          assert command['environment_names'] == ['M5_KIND_NODE_IMAGE']
          assert command['timeout_seconds'] <= 900
          assert substrate['resource_budget']['max_clusters_created'] == 1
          assert substrate['resource_budget']['allowed_cluster_name_prefix'] == 'manager-demo-'
          assert substrate['receipt']['schema'] == 'full-manager-mvp/local-kind-substrate-receipt/v1'
          assert substrate['receipt']['evidence_ceiling'] == 'LOCAL_KIND_KUBERNETES_APPLICATION_SMOKE_ONLY'
          assert substrate['receipt']['required_verdict'] == 'PASS'
          assert any('production Kubernetes experience' in x for x in substrate['receipt']['forbidden_promotions'])

          advanced = items['M5-ARGO-MODEL-CAPACITY-003']
          assert advanced['state'] == 'BLOCKED_UNRESOLVED'
          assert advanced['runtime_lane']['commands'] == []
          assert advanced['receipt']['evidence_ceiling'] == 'NOT_EXERCISED_UNTIL_CONCRETE_RUNNERS_EXIST'
          assert 'merge' in q['authority']['automation_forbidden']
          print('m5-local-handoff-contract=PASS')
          PY

      - name: Evidence boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## M5 Local Handoff contract boundary
          - exact M4 remote reviewer source binding: exercised
          - active deterministic local reviewer command: validated only, **NOT EXECUTED**
          - next live-kind command: concrete and bound to PR #51 runner subject, **WAITING_PREDECESSOR**
          - required kind node image identity remains an explicit local environment input
          - live kind/Kubernetes execution: **NOT_EXERCISED**
          - local kind receipt: **ABSENT**
          - Argo/model/1,000-VU next item: `BLOCKED_UNRESOLVED`
          - evidence ceiling: `GITHUB_HOSTED_LOCAL_HANDOFF_CONTRACT_VALIDATION_ONLY`
          EOF
