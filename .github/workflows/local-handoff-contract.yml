name: Canonical Local Handoff contract

on:
  pull_request:
    paths:
      - 'handoff/local-handoff-queue.json'
      - 'scripts/handoff/run_local_reviewer_handoff.py'
      - '.github/workflows/local-handoff-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-local-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SKILLS_SHARED_COMMIT: 4ca9417b1da5ff32f1d4d3e7af64a15908749024
    steps:
      - name: Checkout exact consumer workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact canonical Tech Lead method
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ed3c/skills-shared
          ref: ${{ env.SKILLS_SHARED_COMMIT }}
          path: _skills-shared
          persist-credentials: false

      - name: Compile canonical local reviewer wrapper
        run: python3 -m py_compile scripts/handoff/run_local_reviewer_handoff.py

      - name: Run portable Local Handoff assertion
        run: |
          python3 _skills-shared/skills/agentic-tech-lead-orchestration/scripts/assert_local_handoff_queue.py \
            --queue handoff/local-handoff-queue.json
          python3 _skills-shared/skills/agentic-tech-lead-orchestration/scripts/assert_local_handoff_queue.py \
            --queue handoff/local-handoff-queue.json \
            --selftest

      - name: Verify exact execution subject contains every concrete command
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          q = json.loads(Path('handoff/local-handoff-queue.json').read_text())
          subject = q['subject']['commit']
          expected_tree = q['subject']['tree']
          actual_tree = subprocess.check_output(['git', 'rev-parse', f'{subject}^{{tree}}'], text=True).strip()
          assert actual_tree == expected_tree, (actual_tree, expected_tree)
          required_paths = [
              'scripts/handoff/run_local_reviewer_handoff.py',
              'scripts/handoff/run_live_kind_from_env.sh',
              'scripts/handoff/run_live_kind_smoke.py',
              'scripts/demo/run_reviewer_demo.sh',
          ]
          for path in required_paths:
              subprocess.run(['git', 'cat-file', '-e', f'{subject}:{path}'], check=True)
          print('execution-subject-readback=PASS')
          PY

      - name: Assert consumer routing without widening canonical schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          q = json.loads(Path('handoff/local-handoff-queue.json').read_text())
          assert q['schema_version'] == 'agentic-tech-lead/local-handoff-queue/v1'
          assert q['subject']['commit'] == '4cc3e162c00a3af240bab9e62482e07bb3e4f9a1'
          assert q['subject']['tree'] == '5ff3349c1eb5c7976263c2e89347a353ccbc1072'
          assert q['current'] == {'active_item': 'M5-LOCAL-REVIEWER-001', 'state': 'ACTIVE'}
          items = {item['id']: item for item in q['items']}
          assert list(items) == ['M5-LOCAL-REVIEWER-001', 'M5-LIVE-KIND-002', 'M6-ADVANCED-SUBSTRATE-003']

          reviewer = items['M5-LOCAL-REVIEWER-001']
          assert reviewer['state'] == 'ACTIVE'
          assert reviewer['entry']['predecessor'] is None
          assert reviewer['runtime_lane']['commands'][0]['argv'][0:2] == [
              'python3', 'scripts/handoff/run_local_reviewer_handoff.py'
          ]
          assert reviewer['receipt']['required_states'] == ['PASS', 'FAIL']
          assert reviewer['exit']['required_verdict'] == 'PASS'

          kind = items['M5-LIVE-KIND-002']
          assert kind['state'] == 'BLOCKED_BY_PREDECESSOR'
          assert kind['entry']['predecessor'] == reviewer['id']
          assert kind['runtime_lane']['commands'][0]['environment_names'] == ['M5_KIND_NODE_IMAGE']
          assert kind['receipt']['schema'] == 'full-manager-mvp/local-kind-substrate-receipt/v1'

          advanced = items['M6-ADVANCED-SUBSTRATE-003']
          assert advanced['state'] == 'BLOCKED_BY_PREDECESSOR'
          assert advanced['entry']['predecessor'] == kind['id']
          assert advanced['runtime_lane']['commands'] == []
          assert len(advanced['runtime_lane']['unresolved_operations']) == 4

          required_forbidden = {
              'merge', 'force_push', 'issue_close', 'queue_advance',
              'provider_activation', 'semantic_conflict_resolution',
          }
          assert required_forbidden.issubset(set(q['authority']['automation_forbidden']))
          print('consumer-routing=PASS')
          PY

      - name: Evidence boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Canonical Local Handoff boundary
          - canonical method subject: `ed3c/skills-shared@4ca9417b1da5ff32f1d4d3e7af64a15908749024`
          - portable queue assertion: exercised
          - portable queue negative-control selftest: exercised
          - exact execution-subject tree/path readback: exercised
          - local reviewer wrapper compile: exercised
          - local reviewer execution: **NOT_EXERCISED**
          - live kind/Kubernetes execution: **NOT_EXERCISED**
          - advanced Argo/model/1,000-VU/signing runners: unresolved command contracts only
          - evidence ceiling: `GITHUB_HOSTED_CANONICAL_LOCAL_HANDOFF_CONTRACT_ONLY`
          EOF
