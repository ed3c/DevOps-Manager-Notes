name: M9 local receipt admission contract

on:
  pull_request:
    paths:
      - 'scripts/handoff/compile_public_receipt_packet.py'
      - 'scripts/handoff/admit_public_receipt_packet.py'
      - 'tests/handoff/test_public_receipt_packet.py'
      - 'tests/handoff/test_public_receipt_admission_policy.py'
      - 'tests/handoff/fixtures/m9/**'
      - '.github/workflows/m9-local-receipt-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m9-local-receipt-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compile receipt admission surfaces
        run: |
          python3 -m py_compile \
            scripts/handoff/compile_public_receipt_packet.py \
            scripts/handoff/admit_public_receipt_packet.py
          python3 scripts/handoff/admit_public_receipt_packet.py --help >/dev/null

      - name: Run core receipt and Shadow policy controls
        run: |
          python3 tests/handoff/test_public_receipt_packet.py -v
          python3 tests/handoff/test_public_receipt_admission_policy.py -v

      - name: Admit only the current ACTIVE fixture receipt
        run: |
          python3 scripts/handoff/admit_public_receipt_packet.py \
            --fixture-mode \
            --queue tests/handoff/fixtures/m9/queue.json \
            --receipt-root tests/handoff/fixtures/m9 \
            --receipt M9-LOCAL-REVIEWER-001=reviewer-pass.json \
            --output /tmp/m9-public-receipt-packet.json

          jq -e '
            .schema_version == "full-manager-mvp/public-local-receipt-packet/v1" and
            .evidence_kind == "FIXTURE" and
            .evidence_ceiling == "FIXTURE_PUBLIC_RECEIPT_PACKET_ONLY" and
            .aggregate.state == "HUMAN_QUEUE_ADVANCE_REQUIRED" and
            .aggregate.admitted_item_count == 1 and
            .aggregate.pass_count == 1 and
            .aggregate.fail_count == 0 and
            .aggregate.next_item == "M9-LIVE-KIND-002" and
            .aggregate.queue_mutated == false and
            .aggregate.queue_advanced == false and
            .aggregate.compiler_physical_runtime_executed == false and
            .admission_policy.future_blocked_receipts_accepted == false and
            .admission_policy.queue_or_receipt_overwrite_allowed == false
          ' /tmp/m9-public-receipt-packet.json >/dev/null

          if grep -q 'SHOULD_NOT_APPEAR_IN_PUBLIC_PACKET' /tmp/m9-public-receipt-packet.json; then
            echo 'raw log/output tail leaked into public packet'
            exit 1
          fi

      - name: Prove blocked future receipt cannot be admitted early
        run: |
          if python3 scripts/handoff/admit_public_receipt_packet.py \
            --fixture-mode \
            --queue tests/handoff/fixtures/m9/queue.json \
            --receipt-root tests/handoff/fixtures/m9 \
            --receipt M9-LOCAL-REVIEWER-001=reviewer-pass.json \
            --receipt M9-LIVE-KIND-002=kind-pass.json \
            --output /tmp/should-not-admit-blocked.json \
            >/tmp/m9-blocked-reject.out 2>&1; then
            echo 'blocked future receipt unexpectedly admitted'
            exit 1
          fi
          grep -q 'blocked future item' /tmp/m9-blocked-reject.out
          test ! -e /tmp/should-not-admit-blocked.json

      - name: Prove fixture cannot enter live admission mode
        run: |
          if python3 scripts/handoff/admit_public_receipt_packet.py \
            --queue tests/handoff/fixtures/m9/queue.json \
            --receipt-root tests/handoff/fixtures/m9 \
            --receipt M9-LOCAL-REVIEWER-001=reviewer-pass.json \
            --output evidence/local-handoff/should-not-exist.json \
            >/tmp/m9-live-reject.out 2>&1; then
            echo 'fixture receipt unexpectedly entered live admission mode'
            exit 1
          fi
          grep -q 'fixture receipt is forbidden' /tmp/m9-live-reject.out
          test ! -e evidence/local-handoff/should-not-exist.json

      - name: Public disclosure guard
        run: |
          if grep -R -E '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|AKIA[0-9A-Z]{16})' \
            tests/handoff/fixtures/m9 \
            scripts/handoff/admit_public_receipt_packet.py; then
            echo 'secret-like material found in M9 public contract surface'
            exit 1
          fi

      - name: Evidence boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## M9 local receipt admission boundary
          - exact queue/receipt schema and subject validation: exercised with explicit fixtures
          - PASS/FAIL, cleanup, ceiling, prefix-order and byte-bound controls: exercised
          - queue progress shape `COMPLETE* -> ACTIVE -> BLOCKED*`: exercised
          - blocked-future receipt rejection: exercised
          - live output / input-overwrite / receipt-root authority controls: exercised
          - fixture/live isolation and extended sensitive-key guard: exercised
          - public packet allowlist and raw receipt SHA-256 projection: exercised
          - queue mutation or advancement: **NOT_PERFORMED**
          - local reviewer/kind/Argo/model/1,000-VU/signing execution: **NOT_EXERCISED**
          - evidence ceiling: `GITHUB_HOSTED_M9_RECEIPT_ADMISSION_CONTRACT_ONLY`
          EOF
