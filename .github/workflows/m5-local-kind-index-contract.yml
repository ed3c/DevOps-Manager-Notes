name: M5 local kind readiness index

on:
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/INDEX.md'
      - 'docs/milestones/PUBLIC_M5_LOCAL_KIND_RUNNER_READY.md'
      - 'registry/public-m5-local-kind-readiness.json'
      - 'registry/public-m6-runner-contracts.json'
      - 'registry/stack-plan.yaml'
      - '.github/workflows/m5-local-kind-index-contract.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate historical M5 machine index
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          m5 = json.loads(Path('registry/public-m5-local-kind-readiness.json').read_text())
          assert m5['milestone'] == 'PUBLIC_LOCAL_KIND_RUNNER_AND_QUEUE_READY'
          assert m5['verdict'] == 'PASS_BOUNDED'
          assert m5['runner']['pull_request'] == 51
          assert m5['runner']['head'] == '20d2ccb0ed8c877309452eece7c755bb3411c4c1'
          assert m5['runner']['tree'] == '7d4b5d5aaba2d023803b152ce5ac7f23f274eba0'
          assert m5['runner']['contract_workflow_run'] == 32259961112
          assert m5['runner']['local_runtime_verdict'] == 'NOT_EXERCISED'
          assert m5['queue']['pull_request'] == 52
          assert m5['queue']['head'] == '660d4deea81712f3d6ab5288ae09288b2e15cc27'
          assert m5['queue']['contract_workflow_run'] == 32260403160
          assert m5['residuals']['local_kind_kubernetes_application_smoke'] == 'NOT_EXERCISED'
          print('m5-historical-index=PASS')
          PY

      - name: Validate later canonical PR52 correction without laundering M5 history
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib import request

          m6 = json.loads(Path('registry/public-m6-runner-contracts.json').read_text())
          correction = m6['canonical_local_handoff']
          assert correction['pull_request'] == 52
          assert correction['current_head'] == 'f7a3937d7d0979e3adfaf1ebc4adc0532450d925'
          assert correction['workflow_run'] == 32263239722
          assert correction['runtime_state'] == 'NOT_EXERCISED'

          expected = {
              51: '20d2ccb0ed8c877309452eece7c755bb3411c4c1',
              52: 'f7a3937d7d0979e3adfaf1ebc4adc0532450d925',
          }
          for pr, head in expected.items():
              req = request.Request(
                  f'https://api.github.com/repos/ed3c/DevOps-Manager-Notes/pulls/{pr}',
                  headers={
                      'Authorization': f'Bearer {os.environ["GITHUB_TOKEN"]}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with request.urlopen(req, timeout=10) as response:
                  payload = json.load(response)
              actual = payload['head']['sha']
              if actual != head:
                  raise SystemExit(f'stale current PR #{pr}: expected {head}, observed {actual}')
          print('m5-current-subject-readback=PASS')
          PY

      - name: Validate M5 history and M6 correction routing
        run: |
          grep -q 'M5 PUBLIC_LOCAL_KIND_RUNNER_AND_QUEUE_READY' README.md
          grep -q 'Canonical Local Handoff' README.md
          grep -q 'D5-canonical-local-handoff-queue' registry/stack-plan.yaml
          grep -q 'f7a3937d7d0979e3adfaf1ebc4adc0532450d925' registry/stack-plan.yaml
          grep -q 'M5 — PUBLIC_LOCAL_KIND_RUNNER_AND_QUEUE_READY' docs/milestones/PUBLIC_M5_LOCAL_KIND_RUNNER_READY.md

      - name: Evidence boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## M5 historical-index boundary
          - M5 runner PR #51 evidence subject: preserved
          - M5 original PR #52 queue-contract subject: preserved as historical evidence
          - later canonical PR #52 current head: separately re-read and bound through M6 correction
          - historical evidence is not relabeled as evidence for the newer PR head
          - local deterministic reviewer execution: **NOT_EXERCISED**
          - local kind/Kubernetes execution: **NOT_EXERCISED**
          - evidence ceiling: `GITHUB_HOSTED_M5_HISTORICAL_TRACEABILITY_ONLY`
          EOF
