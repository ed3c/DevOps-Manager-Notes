name: M5 local kind readiness index

on:
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/INDEX.md'
      - 'docs/milestones/PUBLIC_M5_LOCAL_KIND_RUNNER_READY.md'
      - 'registry/public-m5-local-kind-readiness.json'
      - 'registry/stack-plan.yaml'
      - '.github/workflows/m5-local-kind-index-contract.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate machine index and evidence boundary
        run: |
          python3 -m json.tool registry/public-m5-local-kind-readiness.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path('registry/public-m5-local-kind-readiness.json').read_text())
          assert index['milestone'] == 'PUBLIC_LOCAL_KIND_RUNNER_AND_QUEUE_READY'
          assert index['verdict'] == 'PASS_BOUNDED'
          assert index['runner']['pull_request'] == 51
          assert index['runner']['head'] == '20d2ccb0ed8c877309452eece7c755bb3411c4c1'
          assert index['runner']['tree'] == '7d4b5d5aaba2d023803b152ce5ac7f23f274eba0'
          assert index['runner']['contract_workflow_run'] == 32259961112
          assert index['runner']['local_runtime_verdict'] == 'NOT_EXERCISED'
          assert index['runner']['local_runtime_receipt'] is None
          assert index['queue']['pull_request'] == 52
          assert index['queue']['head'] == '660d4deea81712f3d6ab5288ae09288b2e15cc27'
          assert index['queue']['contract_workflow_run'] == 32260403160
          assert index['queue_items']['M4-LOCAL-REVIEWER-001']['state'] == 'ACTIVE'
          assert index['queue_items']['M4-LIVE-SUBSTRATE-002']['state'] == 'WAITING_PREDECESSOR'
          assert index['queue_items']['M5-ARGO-MODEL-CAPACITY-003']['state'] == 'BLOCKED_UNRESOLVED'
          assert index['queue_items']['M5-ARGO-MODEL-CAPACITY-003']['commands'] == []
          assert index['residuals']['local_kind_kubernetes_application_smoke'] == 'NOT_EXERCISED'
          print('m5-index-shape=PASS')
          PY

      - name: Re-fetch mutable PR heads
        run: |
          python3 - <<'PY'
          import json, os
          from urllib import request

          expected = {
              51: '20d2ccb0ed8c877309452eece7c755bb3411c4c1',
              52: '660d4deea81712f3d6ab5288ae09288b2e15cc27',
          }
          for pr, head in expected.items():
              req = request.Request(
                  f'https://api.github.com/repos/ed3c/DevOps-Manager-Notes/pulls/{pr}',
                  headers={
                      'Authorization': f'Bearer {os.environ["GITHUB_TOKEN"]}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with request.urlopen(req, timeout=10) as response:
                  payload = json.load(response)
              actual = payload['head']['sha']
              if actual != head:
                  raise SystemExit(f'stale M5 index PR #{pr}: expected {head} observed {actual}')
          print('m5-pr-head-readback=PASS')
          PY

      - name: Validate README AGENTS and Stack routing
        run: |
          grep -q 'M5 PUBLIC_LOCAL_KIND_RUNNER_AND_QUEUE_READY' README.md
          grep -q 'M4-LIVE-SUBSTRATE-002       WAITING_PREDECESSOR' AGENTS.md
          grep -q 'id: K5-live-kind-runner' registry/stack-plan.yaml
          grep -q 'pull_request: 51' registry/stack-plan.yaml
          grep -q 'id: D5-live-kind-queue-compiler' registry/stack-plan.yaml
          grep -q 'pull_request: 52' registry/stack-plan.yaml
          grep -q 'local_execution:' registry/stack-plan.yaml
          grep -q 'state: NOT_EXERCISED' registry/stack-plan.yaml
          grep -q 'runner CI PASS       → local kind PASS' docs/milestones/PUBLIC_M5_LOCAL_KIND_RUNNER_READY.md

      - name: Evidence boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## M5 index boundary
          - runner PR/head/tree/CI subject: re-read and indexed
          - queue PR/head/CI subject: re-read and indexed
          - README/AGENTS/Stack routing: validated
          - runner/queue readiness: `PASS_BOUNDED`
          - local deterministic reviewer execution: **NOT_EXERCISED**
          - local kind/Kubernetes execution: **NOT_EXERCISED**
          - local kind runtime receipt: **ABSENT**
          - evidence ceiling: `GITHUB_HOSTED_M5_TRACEABILITY_INDEX_ONLY`
          EOF
