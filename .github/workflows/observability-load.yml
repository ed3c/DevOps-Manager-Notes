name: Full MVP observability and load

on:
  pull_request:
    paths:
      - 'platform/app/**'
      - 'observability/**'
      - 'sre/**'
      - 'tests/load/**'
      - 'tests/integration/test_observability.py'
      - 'evidence/receipts/observability/**'
      - '.github/workflows/observability-load.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-load-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  remote-first-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/app/pyproject.toml
      - name: Install
        run: python -m pip install -e 'platform/app[dev]'
      - name: Deterministic telemetry tests
        run: pytest -q tests/integration/test_observability.py
      - name: Start bounded demo service
        run: |
          uvicorn manager_demo.main:app --host 127.0.0.1 --port 8000 > /tmp/manager-demo.log 2>&1 &
          echo $! > /tmp/manager-demo.pid
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/manager-demo.log
          exit 1
      - name: Run bounded synthetic load smoke
        run: |
          mkdir -p live-evidence
          locust -f tests/load/locustfile.py \
            --headless -u 20 -r 10 -t 5s \
            --host http://127.0.0.1:8000 \
            --csv live-evidence/locust \
            --exit-code-on-error 1 \
            --only-summary
      - name: Assert Prometheus and trace surfaces
        run: |
          curl --fail --silent http://127.0.0.1:8000/metrics > live-evidence/metrics.txt
          grep -q 'manager_demo_http_requests_total' live-evidence/metrics.txt
          TRACE_ID="$(curl --fail --silent -D - -o /dev/null http://127.0.0.1:8000/health/live | awk -F': ' 'tolower($1)=="x-trace-id" {gsub("\r", "", $2); print $2}')"
          test "${#TRACE_ID}" -eq 32
          printf '%s\n' "$TRACE_ID" > live-evidence/trace-id.txt
      - name: Generate exact-subject receipt
        run: |
          python evidence/receipts/observability/generate_receipt.py \
            --source-commit "$SOURCE_COMMIT" \
            --workflow-commit "$GITHUB_WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --runner "${RUNNER_OS}/${RUNNER_ARCH}/ubuntu-24.04" \
            --stats live-evidence/locust_stats.csv \
            --output live-evidence/observability-receipt.json
          python -m json.tool live-evidence/observability-receipt.json >/dev/null
      - name: Persist receipt and smoke evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-manager-mvp-observability-${{ github.run_id }}-${{ github.run_attempt }}
          path: live-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Evidence boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Observability/load FIRST_GREEN boundary
          - source: \`${SOURCE_COMMIT}\`
          - trace identity: exercised
          - Prometheus metrics: exercised
          - bounded load: 20 virtual users / 5 seconds
          - 1,000 virtual users: **NOT_EXERCISED**
          - production traffic/adoption: **NOT_EXERCISED**
          - artifact digest: \`${{ steps.upload.outputs.artifact-digest }}\`
          EOF
      - name: Cleanup
        if: always()
        run: |
          if test -f /tmp/manager-demo.pid; then kill "$(cat /tmp/manager-demo.pid)" 2>/dev/null || true; fi
