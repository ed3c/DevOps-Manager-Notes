name: M8 main integration and Local Handoff closure

on:
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/INDEX.md'
      - 'docs/milestones/**'
      - 'registry/public-m*.json'
      - 'registry/stack-plan.yaml'
      - 'handoff/local-handoff-queue.json'
      - 'scripts/handoff/compile_m8_advanced_queue.py'
      - 'tests/handoff/test_compile_m8_advanced_queue.py'
      - '.github/workflows/m8-main-integration-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m8-main-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SKILLS_SHARED_COMMIT: 4ca9417b1da5ff32f1d4d3e7af64a15908749024
      EXECUTION_COMMIT: e7b4e23799a3579572598ebd5864a80831d49db4
      EXECUTION_TREE: 0b72b9f09f73d3829db2f138d457a5691641bf79
      INTEGRATED_MAIN: bb940bf7d5a3b1f605b79e9fb8f33c463a8ee5a7
    steps:
      - name: Checkout exact closure subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Checkout exact canonical Tech Lead method
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ed3c/skills-shared
          ref: ${{ env.SKILLS_SHARED_COMMIT }}
          path: _skills-shared
          persist-credentials: false

      - name: Validate execution subject and command reachability
        run: |
          test "$(git rev-parse "${EXECUTION_COMMIT}^{tree}")" = "$EXECUTION_TREE"
          git merge-base --is-ancestor "$INTEGRATED_MAIN" HEAD
          for path in \
            scripts/handoff/run_local_reviewer_handoff.py \
            scripts/handoff/run_live_kind_from_env.sh \
            scripts/handoff/run_live_kind_smoke.py \
            scripts/handoff/compile_m7_advanced_queue.py \
            scripts/handoff/compile_m8_advanced_queue.py \
            scripts/handoff/run_argo_ephemeral_kind_from_env.sh \
            scripts/handoff/run_local_model_from_env.sh \
            scripts/handoff/run_local_capacity.py \
            scripts/handoff/run_local_registry_signing_from_env.sh; do
            git cat-file -e "${EXECUTION_COMMIT}:${path}"
          done
          echo 'execution-subject-readback=PASS'

      - name: Compile and test explicit-subject queue wrapper
        run: |
          python3 -m py_compile \
            scripts/handoff/compile_m7_advanced_queue.py \
            scripts/handoff/compile_m8_advanced_queue.py
          python3 tests/handoff/test_compile_m8_advanced_queue.py -v

      - name: Validate canonical M8 Local Handoff queue
        run: |
          python3 _skills-shared/skills/agentic-tech-lead-orchestration/scripts/assert_local_handoff_queue.py \
            --queue handoff/local-handoff-queue.json
          python3 _skills-shared/skills/agentic-tech-lead-orchestration/scripts/assert_local_handoff_queue.py \
            --queue handoff/local-handoff-queue.json \
            --selftest
          python3 - <<'PY'
          import json
          from pathlib import Path

          queue = json.loads(Path('handoff/local-handoff-queue.json').read_text())
          assert queue['subject']['commit'] == 'e7b4e23799a3579572598ebd5864a80831d49db4'
          assert queue['subject']['tree'] == '0b72b9f09f73d3829db2f138d457a5691641bf79'
          assert queue['current'] == {'active_item': 'M8-LOCAL-REVIEWER-001', 'state': 'ACTIVE'}
          items = {item['id']: item for item in queue['items']}
          assert list(items) == [
              'M8-LOCAL-REVIEWER-001',
              'M8-LIVE-KIND-002',
              'M8-COMPILE-ADVANCED-QUEUE-003',
          ]
          assert [item['state'] for item in queue['items']] == [
              'ACTIVE', 'BLOCKED_BY_PREDECESSOR', 'BLOCKED_BY_PREDECESSOR'
          ]
          compiler = items['M8-COMPILE-ADVANCED-QUEUE-003']['runtime_lane']['commands'][0]['argv']
          assert '--expected-predecessor-commit' in compiler
          assert 'e7b4e23799a3579572598ebd5864a80831d49db4' in compiler
          assert '--expected-predecessor-tree' in compiler
          assert '0b72b9f09f73d3829db2f138d457a5691641bf79' in compiler
          print('m8-queue-routing=PASS')
          PY

      - name: Validate machine indexes and integrated DAG
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          m8 = json.loads(Path('registry/public-m8-main-integration.json').read_text())
          assert m8['schema_version'] == 'full-manager-mvp/public-m8-main-integration/v1'
          assert m8['milestone'] == 'PUBLIC_MAIN_INTEGRATION_AND_HANDOFF_READY'
          assert m8['verdict'] == 'PASS_BOUNDED'
          assert m8['main_integration']['integrated_head_before_m8_docs'] == 'bb940bf7d5a3b1f605b79e9fb8f33c463a8ee5a7'
          assert m8['local_handoff']['execution_subject']['commit'] == 'e7b4e23799a3579572598ebd5864a80831d49db4'
          assert m8['local_handoff']['physical_receipts_admitted'] == 0
          assert m8['open_residual_issues'] == [2, 3, 7, 9, 67]
          for name in (
              'public-m2-first-green.json',
              'public-m3-failure-recovery.json',
              'public-m4-reviewer-convergence.json',
              'public-m5-local-kind-readiness.json',
              'public-m6-runner-contracts.json',
              'public-m7-advanced-bundle.json',
          ):
              assert (Path('registry') / name).is_file(), name
          print('m8-machine-index=PASS')
          PY
          grep -q '^version: 10$' registry/stack-plan.yaml
          grep -q 'pull_request: 68' registry/stack-plan.yaml
          grep -q 'pull_request: 69' registry/stack-plan.yaml
          grep -q 'M8 PUBLIC_MAIN_INTEGRATION_AND_HANDOFF_READY' README.md
          grep -q 'Directory → State Machine → DAG ownership' README.md
          grep -q 'Molecular Git Town / Stack PR index' README.md
          grep -q 'M8 — PUBLIC_MAIN_INTEGRATION_AND_HANDOFF_READY' docs/milestones/PUBLIC_M8_MAIN_INTEGRATION.md

      - name: Assert integrated merge subjects are ancestors
        run: |
          for commit in \
            d0ecbd05c1dfecc6ae65f62c9869cd6a1412da43 \
            a47c0de9d5d0a176821a95c7a6c961ed7cf9f058 \
            cf7f0f5939e75475ce10da14f932de1a7f33b257 \
            9e5b9c23467ff90a1c1452a255d4a6cfa245b6bf \
            0b0709946e84e80918a0e50903badb8b7bd4fa12 \
            bb940bf7d5a3b1f605b79e9fb8f33c463a8ee5a7; do
            git merge-base --is-ancestor "$commit" HEAD
          done

      - name: Public disclosure guard
        run: |
          if grep -R -E '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_)' \
            README.md AGENTS.md docs/INDEX.md docs/milestones registry/public-m8-main-integration.json handoff/local-handoff-queue.json; then
            echo 'secret-like material found in M8 public closure surface'
            exit 1
          fi

      - name: Evidence boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## M8 main integration and Local Handoff boundary
          - exact integrated main merge ancestry: exercised
          - M2–M8 traceability and machine indexes: exercised
          - M8 stable execution subject/path readback: exercised
          - explicit-subject advanced queue wrapper tests: exercised
          - canonical queue assertion + negative-control selftest: exercised
          - local reviewer execution: **NOT_EXERCISED**
          - live kind/Kubernetes: **NOT_EXERCISED**
          - Argo/model/1000-VU/registry-signing runtime: **NOT_EXERCISED**
          - production/adoption/incident/tenure claims: **OUTSIDE_CURRENT_PROOF**
          - evidence ceiling: `GITHUB_MAIN_INTEGRATION_AND_LOCAL_HANDOFF_CONTRACT_ONLY`
          EOF
