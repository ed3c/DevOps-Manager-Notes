name: Full MVP supply chain and bounded fault

on:
  pull_request:
    paths:
      - 'supply-chain/**'
      - 'tests/failure/network/**'
      - 'evidence/receipts/supply-chain/**'
      - '.github/workflows/supply-chain-fault.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  remote-first-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      COSIGN_PASSWORD: public-m2-ephemeral-ci-key
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Cosign from pinned installer action
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install Syft with release checksum verification
        run: |
          chmod +x supply-chain/install_syft.sh
          supply-chain/install_syft.sh "$PWD/.tools"
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Build exact Core image and save immutable blob subject
        run: |
          mkdir -p live-evidence
          docker build -f platform/docker/Dockerfile -t full-manager-mvp:${SOURCE_COMMIT} platform/app
          docker image inspect full-manager-mvp:${SOURCE_COMMIT} --format '{{.Id}}' > live-evidence/container-image-id.txt
          docker save full-manager-mvp:${SOURCE_COMMIT} -o live-evidence/full-manager-mvp.tar
          sha256sum live-evidence/full-manager-mvp.tar | tee live-evidence/container-archive.sha256
      - name: Generate SBOM from exact saved image archive
        run: |
          syft live-evidence/full-manager-mvp.tar \
            -o cyclonedx-json=live-evidence/sbom.cdx.json
          jq -e '.components | length > 0' live-evidence/sbom.cdx.json >/dev/null
          sha256sum live-evidence/sbom.cdx.json > live-evidence/sbom.sha256
      - name: Cosign sign and verify the same immutable archive
        run: |
          cd live-evidence
          cosign generate-key-pair
          cosign sign-blob --yes --key cosign.key --bundle archive.sigstore.json full-manager-mvp.tar
          cosign verify-blob --key cosign.pub --bundle archive.sigstore.json full-manager-mvp.tar
          cp full-manager-mvp.tar tampered.tar
          printf 'tamper\n' >> tampered.tar
          if cosign verify-blob --key cosign.pub --bundle archive.sigstore.json tampered.tar; then
            echo 'signature incorrectly admitted tampered artifact'
            exit 1
          fi
          rm -f cosign.key tampered.tar
      - name: Start bounded upstream and Toxiproxy fault substrate
        run: |
          mkdir -p /tmp/manager-upstream
          printf 'upstream-ok\n' > /tmp/manager-upstream/health.txt
          python3 -m http.server 18080 --bind 127.0.0.1 --directory /tmp/manager-upstream > /tmp/upstream.log 2>&1 &
          echo $! > /tmp/upstream.pid
          docker pull ghcr.io/shopify/toxiproxy:2.12.0
          docker image inspect ghcr.io/shopify/toxiproxy:2.12.0 --format '{{index .RepoDigests 0}}' | tee live-evidence/toxiproxy-repodigest.txt
          docker run -d --rm --network host --name manager-toxiproxy ghcr.io/shopify/toxiproxy:2.12.0
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8474/version >/dev/null; then exit 0; fi
            sleep 0.5
          done
          docker logs manager-toxiproxy
          exit 1
      - name: Inject bounded latency and prove cleanup
        run: |
          python3 tests/failure/network/toxiproxy_latency_probe.py --latency-ms 450 | tee live-evidence/toxiproxy-fault.json
          grep -q '"cleanup": "PASS"' live-evidence/toxiproxy-fault.json
      - name: Generate exact-subject supply-chain receipt
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def read(path): return Path(path).read_text().strip()
          receipt = {
            'schema_version': 'full-manager-mvp/supply-chain-receipt/v1',
            'source_commit': os.environ['SOURCE_COMMIT'],
            'workflow_commit': os.environ['GITHUB_WORKFLOW_SHA'],
            'workflow_run_id': os.environ['GITHUB_RUN_ID'],
            'subjects': {
              'container_image_id': read('live-evidence/container-image-id.txt'),
              'container_archive_sha256': read('live-evidence/container-archive.sha256').split()[0],
              'sbom_sha256': read('live-evidence/sbom.sha256').split()[0],
              'toxiproxy_repo_digest': read('live-evidence/toxiproxy-repodigest.txt'),
            },
            'tools': {'syft': '1.50.0', 'cosign': '3.1.3', 'toxiproxy': '2.12.0'},
            'checks': {
              'sbom_generated': 'PASS', 'blob_signature_verified': 'PASS',
              'tampered_blob_rejected': 'PASS', 'bounded_latency_injected': 'PASS',
              'fault_cleanup': 'PASS', 'production_incident': 'NOT_EXERCISED',
              'registry_image_signature': 'NOT_EXERCISED',
            },
            'verdict': 'PASS',
            'evidence_ceiling': 'GITHUB_HOSTED_SBOM_BLOB_SIGNING_AND_BOUNDED_FAULT_DRILL_ONLY',
          }
          Path('live-evidence/supply-chain-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
      - name: Persist exact lane evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-manager-mvp-supply-${{ github.run_id }}-${{ github.run_attempt }}
          path: live-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Evidence boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Supply-chain/fault FIRST_GREEN boundary
          - Syft SBOM: exercised against exact saved Core image archive
          - Cosign blob signature + planted mismatch rejection: exercised
          - Toxiproxy bounded latency + cleanup: exercised
          - production incident history: **NOT_EXERCISED**
          - registry-stored image signature: **NOT_EXERCISED**
          - artifact digest: \`${{ steps.upload.outputs.artifact-digest }}\`
          EOF
      - name: Cleanup fault substrate
        if: always()
        run: |
          docker rm -f manager-toxiproxy >/dev/null 2>&1 || true
          if test -f /tmp/upstream.pid; then kill "$(cat /tmp/upstream.pid)" 2>/dev/null || true; fi
          rm -f live-evidence/cosign.key 2>/dev/null || true
