name: Full MVP failure recovery convergence

on:
  pull_request:
    paths:
      - 'tests/failure/scenarios/**'
      - 'incidents/**'
      - 'runbooks/**'
      - 'management/**'
      - 'evidence/receipts/failure/**'
      - '.github/workflows/failure-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: failure-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  remote-first-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compile and test deterministic failure primitives
        run: |
          python -m compileall -q tests/failure/scenarios
          python tests/failure/scenarios/test_failure_primitives.py -v

      - name: Validate exact public M2 side-input subjects
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          subject = json.loads(Path('evidence/receipts/failure/public-m2-side-inputs.json').read_text())
          lanes = subject['lanes']
          assert {x['issue'] for x in lanes} == {3, 4, 7, 8, 10}
          assert len({x['pull_request'] for x in lanes}) == 5
          for lane in lanes:
              assert re.fullmatch(r'[0-9a-f]{40}', lane['head'])
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', lane['artifact_digest'])
              assert lane['workflow_run'] > 0 and lane['artifact_id'] > 0
          print('side-input-contract=PASS')
          PY

      - name: Install observed Core plus observability base
        run: python -m pip install -e platform/app

      - name: Start bounded demo service
        run: |
          mkdir -p live-evidence
          DATABASE_URL=sqlite+pysqlite:///./failure-recovery.db \
            uvicorn manager_demo.main:app --host 127.0.0.1 --port 18000 \
            > live-evidence/service.log 2>&1 &
          echo $! > live-evidence/service.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health/live >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat live-evidence/service.log
          exit 1

      - name: Execute seven manager-grade failure drills
        run: |
          python tests/failure/scenarios/run_failure_drills.py \
            --base-url http://127.0.0.1:18000 \
            --source-commit "$SOURCE_COMMIT" \
            --side-inputs evidence/receipts/failure/public-m2-side-inputs.json \
            --output live-evidence/failure-drills.json \
            --markdown live-evidence/failure-drills.md
          jq -e '.verdict == "PASS" and .summary.total == 7 and .summary.pass == 7' \
            live-evidence/failure-drills.json >/dev/null

      - name: Assert business failure is visible in Prometheus surface
        run: |
          curl --fail --silent http://127.0.0.1:18000/metrics > live-evidence/metrics.txt
          grep -q 'manager_demo_business_oracle_total{verdict="FAIL"}' live-evidence/metrics.txt
          grep -q 'manager_demo_business_oracle_total{verdict="PASS"}' live-evidence/metrics.txt

      - name: Generate exact-subject failure receipt
        run: |
          sha256sum live-evidence/failure-drills.json > live-evidence/failure-drills.sha256
          sha256sum evidence/receipts/failure/public-m2-side-inputs.json > live-evidence/side-inputs.sha256
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('live-evidence/failure-drills.json').read_text())
          receipt = {
            'schema_version': 'full-manager-mvp/failure-recovery-receipt/v1',
            'source_commit': os.environ['SOURCE_COMMIT'],
            'workflow_commit': os.environ['GITHUB_WORKFLOW_SHA'],
            'workflow_run_id': os.environ['GITHUB_RUN_ID'],
            'subjects': {
              'failure_drills_sha256': Path('live-evidence/failure-drills.sha256').read_text().split()[0],
              'side_inputs_sha256': Path('live-evidence/side-inputs.sha256').read_text().split()[0],
            },
            'checks': {
              'seven_drills': 'PASS',
              'recovery_verified': 'PASS',
              'same_failure_retest': 'PASS',
              'business_failure_metric_visible': 'PASS',
              'production_incident_history': 'NOT_EXERCISED',
              'live_kubernetes_recovery': 'NOT_EXERCISED',
              'real_customer_impact': 'NOT_EXERCISED',
            },
            'verdict': 'PASS',
            'evidence_ceiling': 'GITHUB_HOSTED_DETERMINISTIC_AND_LOCAL_PROCESS_FAILURE_DRILLS_ONLY',
            'scenario_count': report['summary']['total'],
          }
          Path('live-evidence/failure-recovery-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Persist bounded failure evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-manager-mvp-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            live-evidence/failure-drills.json
            live-evidence/failure-drills.md
            live-evidence/failure-drills.sha256
            live-evidence/side-inputs.sha256
            live-evidence/failure-recovery-receipt.json
            live-evidence/metrics.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Evidence boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Failure/recovery FIRST_GREEN boundary
          - seven bounded failure drills: exercised
          - recovery verification: exercised
          - same-failure re-test: exercised
          - business failure visible while infrastructure stays live: exercised
          - production incident history: **NOT CLAIMED**
          - live Kubernetes/production recovery: **NOT_EXERCISED**
          - artifact digest: `${{ steps.upload.outputs.artifact-digest }}`
          - evidence ceiling: `GITHUB_HOSTED_DETERMINISTIC_AND_LOCAL_PROCESS_FAILURE_DRILLS_ONLY`
          EOF

      - name: Cleanup
        if: always()
        run: |
          if test -f live-evidence/service.pid; then
            kill "$(cat live-evidence/service.pid)" 2>/dev/null || true
          fi
