version: 2
method_owner: ed3c/skills-shared/skills/git-town-stacked-pr-worker
consumer: ed3c/DevOps-Manager-Notes
policy:
  branch_or_pr_must_exist_before_identity_is_recorded: true
  true_child_requires_unmerged_artifact_consumption: true
  path_disjoint_work_should_remain_sibling: true
  external_process_dependencies_do_not_create_git_ancestry: true
  one_convergence_owner_per_shared_surface: true
  merge_release_promotion_human_owned: true
  start_readiness_is_not_completion_readiness: true

atoms:
  - id: C0-bootstrap-contract
    atom: C
    issues: []
    pull_request: 6
    state: PR_OPEN
    stack_class: root
    branch: bootstrap/devops-evidence-contract
    base_branch: main
    owns_paths:
      - README.md
      - AGENTS.md
      - LICENSE
      - roles/
      - registry/
      - docs/
      - scripts/handoff/
      - handoff/
    provides_artifacts:
      - devops-manager-system-contract-v1
      - technology-candidate-registry-v1
      - molecular-stack-plan-v1
    blockers:
      - HUMAN_ADMIT_MERGE

  - id: C11-full-mvp-contract
    atom: C
    issues: [11]
    pull_request: 12
    state: PR_DRAFT
    stack_class: child
    parent: C0-bootstrap-contract
    branch: agent/full-manager-mvp-demo-stack
    base_branch: bootstrap/devops-evidence-contract
    owns_paths:
      - docs/architecture/FULL_MVP_DEMO.md
      - registry/mvp-demo-stack.yaml
      - README.md
      - AGENTS.md
      - registry/stack-plan.yaml
      - prompts/
      - scripts/handoff/check_full_mvp_prerequisites.py
      - handoff/local-handoff-queue.json
    consumes_artifacts:
      - devops-manager-system-contract-v1
    provides_artifacts:
      - full-manager-mvp-contract-v1
      - full-mvp-technology-selection-v1
      - full-mvp-worker-prompt-pack-v1
      - full-mvp-local-prerequisite-probe-v1
    blockers:
      - TRANSITIVE_IMAGE_MODEL_LICENSE_AUDIT_REMAINS
      - HUMAN_ADMIT_MERGE

  - id: E1-requirement-invariant-audit
    atom: E
    issues: [1]
    pull_request: null
    state: PLANNED
    stack_class: child
    parent: C11-full-mvp-contract
    branch: null
    base_branch: agent/full-manager-mvp-demo-stack
    owns_paths:
      - registry/evidence.yaml
      - registry/gaps.yaml
      - system-design/
      - sre/availability-model.md
    consumes_artifacts:
      - devops-manager-system-contract-v1
      - full-manager-mvp-contract-v1
    provides_artifacts:
      - exact-devops-invariant-audit-v1
    blockers:
      - EXACT_REPOSITORY_EVIDENCE_NOT_YET_BOUND

  - id: K2-base-delivery
    atom: K
    issues: [2]
    pull_request: null
    state: PLANNED
    stack_class: child
    parent_completion: E1-requirement-invariant-audit
    branch: null
    base_branch: null
    owns_paths:
      - platform/app/
      - platform/docker/
      - platform/kubernetes/
      - platform/gitops/
      - tests/unit/
      - tests/integration/
      - evidence/receipts/base/
      - .github/workflows/
    consumes_artifacts:
      - exact-devops-invariant-audit-v1
      - full-mvp-technology-selection-v1
    provides_artifacts:
      - typed-base-service-contract-v1
      - business-oracle-contract-v1
      - immutable-artifact-contract-v1
      - local-k8s-delivery-contract-v1
      - evidence-envelope-contract-v1
    blockers:
      - LOCAL_RUNTIME_CAPABILITY_NOT_YET_EXERCISED
      - COMPLETION_REQUIRES_E1

  - id: A3-observability-load
    atom: A
    issues: [3]
    pull_request: null
    state: PLANNED
    stack_class: sibling
    parent_completion: K2-base-delivery
    branch: null
    base_branch: null
    owns_paths:
      - observability/
      - sre/sli-slo.md
      - sre/error-budget.md
      - sre/capacity-planning.md
      - tests/load/
      - evidence/receipts/observability/
