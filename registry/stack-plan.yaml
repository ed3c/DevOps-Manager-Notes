      - HUMAN_ADMIT_PUBLICATION

notes:
  - PR #12 is a true child of PR #6 because it consumes the unmerged bootstrap contract.
  - E1 is planned as a child of C11 while the Full MVP contract remains unmerged and E1 consumes it directly.
  - A3/E4/A7/A8/E10 are siblings only after K2 freezes shared typed service/artifact/evidence contracts.
  - If one sibling consumes another sibling's unmerged bytes, reclassify the observed relation as a true child.
  - X5 and X9 must not fabricate multiple Git parents; choose one stable admitted base and consume other prerequisite receipts as exact verified side inputs.
  - No branch/PR identity is recorded before it exists. PLANNED nodes keep null Git identities.
