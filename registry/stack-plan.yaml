  - PRs #55/#56/#57/#58 are one M6 task-sibling group but have different real Git parents according to the unmerged implementation bytes they consume.
  - PR #59 is a docs/registry convergence surface; it binds execution subjects as side inputs and does not consume their unmerged implementation bytes.
