  - id: X9-full-demo-convergence
    atom: X
    issues: [9]
    pull_request: null
    state: PLANNED
    stack_class: convergence
    parent_completion:
      - X5-failure-recovery-convergence
      - A8-demo-console
    branch: null
    base_branch: null
    owns_paths:
      - README.md
      - docs/INDEX.md
      - docs/architecture/FULL_MVP_DEMO.md
      - registry/stack-plan.yaml
      - scripts/demo/
      - evidence/receipts/convergence/
    consumes_artifacts:
      - manager-reliability-closure-v2
      - same-failure-retest-evidence-v1
      - manager-demo-console-v1
