  - id: E4-policy-security-license
    atom: E
    issues: [4]
    pull_request: null
    state: PLANNED
    stack_class: sibling
    parent_completion: K2-base-delivery
    branch: null
    base_branch: null
    owns_paths:
      - platform/policies/
      - tests/failure/policy/
      - evidence/receipts/security/
