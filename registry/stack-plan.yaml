    pull_request: null
    state: PLANNED
    stack_class: sibling
    parent_completion: K2-base-delivery
    branch: null
    base_branch: null
    owns_paths:
      - demo-console/
    consumes_artifacts:
      - typed-base-service-contract-v1
      - evidence-envelope-contract-v1
