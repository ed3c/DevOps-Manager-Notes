  - PRs #36/#38/#39/#37/#40 are observed siblings based on PR #14 Core. None consumes another sibling's unmerged bytes.
  - #3 has an explicit minimal shared-Core path lease delta for telemetry integration; convergence must reconcile it rather than pretending full path disjointness.
  - PR #42 is Git-ancestry child of PR #36 because it executes against telemetry-enabled unmerged Core bytes, while task semantics remain multi-input convergence using #38/#39/#40 as exact side-input identities.
  - Demo Console PR #37 is intentionally not a #5 dependency; it joins #42 only at X9 final reviewer convergence.
  - A remote FIRST_GREEN receipt is lane-bounded and does not satisfy Local Handoff, production, real-adoption, legal-clearance, or real-incident claims.
  - X5/X9 must not fabricate multiple Git parents. One Git base is chosen; other prerequisites remain exact verified side inputs.
  - No branch/PR identity is recorded before it exists. Planned nodes retain null Git identities.
