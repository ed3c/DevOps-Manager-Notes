  - PRs #36/#38/#39/#37/#40 are sibling leaves based on frozen PR #14 Core.
  - PR #42 is a Git child of PR #36 while task semantics converge PR #38/#39/#40 through exact side inputs.
  - Demo Console PR #37 is intentionally not a #5 dependency; it joins at X9.
  - PR #44 is a Git child of PR #42. It proves PR #37 byte parity and re-downloads all six bound Actions artifacts before evidence admission.
  - PR #45 is the Local Handoff child of PR #44. Its GitHub workflow proves queue shape only; local execution still requires a returned receipt.
  - Mutable current PR heads and historical artifact evidence heads are separate subjects.
  - A remote or local FIRST_GREEN never promotes to production, real-adoption, legal-clearance, real-incident or tenure evidence.
  - X5/X9 never fabricate multiple Git parents; one Git base is used and other prerequisites remain typed side inputs.
