rules:
  - exact subject, revision, workload and environment must be bound before PASS
  - CI green does not prove business or operational correctness
  - local Kubernetes does not prove production Kubernetes behavior
  - virtual users do not prove real user adoption
  - synthetic incidents must remain DRILL or SIMULATION
  - rollback and recovery evidence are distinct from successful deployment evidence
  - evidence PASS closes only the named narrow subclaim
  - repository artifacts cannot prove employment tenure or people-management history
