[build-system]
requires = ["setuptools==82.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "full-manager-mvp-control-plane"
version = "0.1.0"
description = "Typed control-plane service for the Full Manager MVP Demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "sqlalchemy==2.0.52",
  "alembic==1.19.1",
  "psycopg[binary]==3.3.4",
  "uvicorn==0.52.4",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "locust==2.46.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../../tests/unit", "../../tests/integration"]
